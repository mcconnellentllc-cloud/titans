<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <defs>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C2340"/>
      <stop offset="50%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0C2340"/>
    </linearGradient>
    <linearGradient id="facemaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A2AAAD"/>
      <stop offset="100%" style="stop-color:#666666"/>
    </linearGradient>
  </defs>
  <!-- Helmet shell -->
  <ellipse cx="100" cy="85" rx="85" ry="75" fill="url(#helmetGrad)" stroke="#4B92DB" stroke-width="2"/>
  <!-- Stripe -->
  <path d="M100 10 Q100 85 100 160" stroke="#C8102E" stroke-width="8" fill="none"/>
  <path d="M100 10 Q100 85 100 160" stroke="#4B92DB" stroke-width="3" fill="none"/>
  <!-- Facemask -->
  <path d="M30 90 Q20 100 25 120 Q40 140 70 145 Q90 148 100 148"
        stroke="url(#facemaskGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M35 100 Q45 115 65 125" stroke="url(#facemaskGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M40 110 Q55 125 75 130" stroke="url(#facemaskGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Sword logo on helmet -->
  <g transform="translate(110, 50) scale(0.4)">
    <path d="M50 10 L60 70 L55 75 L50 120 L45 75 L40 70 Z" fill="#A2AAAD" stroke="#4B92DB" stroke-width="1"/>
    <rect x="35" y="68" width="30" height="8" rx="2" fill="#C8102E"/>
  </g>
  <!-- Chin strap -->
  <path d="M25 130 Q30 150 50 160" stroke="#333" stroke-width="4" fill="none"/>
</svg>
